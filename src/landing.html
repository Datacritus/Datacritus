<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="DATACRITUS: Greece, data and democracy. Explore 460 indicators and compare government periods."><title>DATACRITUS — Data Decision Democracy</title><link rel="canonical" href="https://www.datacritus.gr/"><style>body{margin:0;background:#073b4c}</style></head><body><div id="dc-poster">
<style>
#dc-poster{--dc-night:light-dark(#073b4c,#052c39);--dc-paper:light-dark(#f6f6ed,#f0f2e9);--dc-yellow:#ffd166;--dc-faint:light-dark(#a9c0c4,#afc7cc);font-family:Arial,'Helvetica Neue',sans-serif;background:var(--dc-night);color:var(--dc-paper);overflow:hidden}#dc-poster *{box-sizing:border-box}#dc-poster a{color:inherit;text-decoration:none}#dc-poster button{font:inherit;cursor:pointer}#dc-poster a:focus-visible,#dc-poster button:focus-visible{outline:3px solid currentColor;outline-offset:6px}#dc-poster .dp-brand{background:var(--dc-yellow);color:#073b4c;padding:21px 5% 31px;position:relative}#dc-poster .dp-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.15em;font-weight:700;margin-bottom:31px}#dc-poster .dp-top button{border:1px solid #073b4c77;background:transparent;color:#073b4c;border-radius:50%;width:43px;height:43px;font-size:12px;letter-spacing:0}#dc-poster .dp-logo{position:relative;width:100%;aspect-ratio:3.338;overflow:hidden}#dc-poster .dp-logo img{position:absolute;max-width:none;width:172.15%;height:auto;left:0;top:0;transform:translate(-19.36%,-36.65%)}#dc-poster .dp-stage{position:relative;display:grid;grid-template-columns:1.55fr 1fr;gap:25px;padding:38px 5% 42px;isolation:isolate}#dc-poster .dp-quote{position:relative;z-index:1}#dc-poster .dp-label{font-size:11px;letter-spacing:.15em;color:var(--dc-faint);margin-bottom:25px;display:flex;align-items:center;gap:12px}#dc-poster .dp-label:before{content:'';height:1px;width:34px;background:var(--dc-faint)}#dc-poster h1{margin:0;font-size:clamp(40px,6.2vw,73px);line-height:.97;letter-spacing:-.065em;font-weight:800;max-width:610px;text-transform:uppercase}#dc-poster h1 em{color:var(--dc-yellow);font-style:normal}#dc-poster .dp-counter{margin-top:25px;display:flex;gap:12px;align-items:center;font-size:11px;letter-spacing:.12em;color:var(--dc-faint)}#dc-poster .dp-counter b{color:var(--dc-yellow);font-size:23px;letter-spacing:-.04em}#dc-poster .dp-entry{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:22px}#dc-poster .dp-circle{background:var(--dc-yellow);color:#073b4c;width:200px;height:200px;border-radius:50%;display:flex;justify-content:center;align-items:center;flex-direction:column;gap:17px;transition:transform .25s ease;box-shadow:0 0 0 12px #ffd16609}#dc-poster .dp-circle:hover{transform:rotate(-7deg) scale(1.04)}#dc-poster .dp-circle span:first-child{font-size:16px;letter-spacing:.07em;font-weight:700}#dc-poster .dp-arrow{font-size:64px;line-height:.7;font-weight:400}#dc-poster .dp-challenge{font-size:15px;letter-spacing:-.02em;max-width:220px;text-align:center;line-height:1.4}#dc-poster .dp-rings{position:absolute;width:500px;height:500px;right:-115px;bottom:-150px;border:1px solid #ffd16614;border-radius:50%;z-index:0;pointer-events:none}#dc-poster .dp-rings:before,#dc-poster .dp-rings:after{content:'';position:absolute;inset:45px;border:1px solid #ffd16612;border-radius:50%}#dc-poster .dp-rings:after{inset:90px}#dc-poster .dp-footer{padding:18px 5%;border-top:1px solid #a9c0c433;display:flex;align-items:center;justify-content:space-between;gap:18px;font-size:11px;letter-spacing:.13em;color:var(--dc-faint)}#dc-poster .dp-footer strong{color:var(--dc-paper);font-weight:400}#dc-poster .dp-pause{background:transparent;color:var(--dc-faint);border:1px solid #a9c0c444;border-radius:50%;width:38px;height:38px;font-size:15px}#dc-poster .dp-switch{display:flex;gap:7px}#dc-poster .dp-switch button{width:30px;min-height:30px;border:0;background:transparent;color:var(--dc-faint);padding:5px;font-size:12px}#dc-poster .dp-switch button[aria-pressed=true]{color:var(--dc-yellow);border-bottom:1px solid var(--dc-yellow)}
@media(max-width:650px){#dc-poster .dp-brand{padding:15px 6% 28px}#dc-poster .dp-top{margin-bottom:20px;font-size:10px;letter-spacing:.09em}#dc-poster .dp-stage{padding:31px 6% 34px;grid-template-columns:1fr;gap:33px}#dc-poster h1{font-size:clamp(39px,9.8vw,63px);max-width:520px}#dc-poster .dp-entry{flex-direction:row;justify-content:space-between;gap:18px}#dc-poster .dp-circle{width:132px;height:132px;flex-shrink:0;gap:13px}#dc-poster .dp-circle span:first-child{font-size:13px}#dc-poster .dp-arrow{font-size:44px}#dc-poster .dp-challenge{font-size:15px;text-align:left;max-width:165px}#dc-poster .dp-footer{font-size:10px;letter-spacing:.06em;flex-wrap:wrap}#dc-poster .dp-label{margin-bottom:22px}#dc-poster .dp-counter{margin-top:23px}#dc-poster .dp-rings{right:-235px;bottom:-120px}}@media(prefers-reduced-motion:reduce){#dc-poster .dp-circle{transition:none}}
</style>
<header class="dp-brand"><div class="dp-top"><span>GREECE · DATA · DEMOCRACY</span><button type="button" class="dp-lang" aria-label="Change language">ΕΛ</button></div><div class="dp-logo"><img src="/*__LOGO__*/" alt="DATACRITUS — Data Decision Democracy"></div></header>
<main class="dp-stage"><div class="dp-quote"><div class="dp-label" id="dp-label">QUESTION EVERYTHING.</div><h1 id="dp-motto">IF VOTING<br>CHANGED ANYTHING,<br>THEY’D MAKE IT<br><em>ILLEGAL.</em></h1><div class="dp-counter"><b>460</b><span id="dp-metrics">INDICATORS. YOUR VERDICT.</span></div></div><div class="dp-entry"><a class="dp-circle" href="dashboard.html" aria-label="Enter DATACRITUS dashboard"><span id="dp-enter">ENTER</span><span class="dp-arrow" aria-hidden="true">↗</span></a><div class="dp-challenge" id="dp-challenge">Don’t take anyone’s word.<br>Check the data.</div></div><div class="dp-rings" aria-hidden="true"></div></main>
<footer class="dp-footer"><span id="dp-footer">LESS SPIN. <strong>MORE EVIDENCE.</strong></span><button type="button" class="dp-pause" aria-label="Pause motto rotation" aria-pressed="false">Ⅱ</button><div class="dp-switch" role="group" aria-label="Choose motto"><button type="button" data-motto="0" aria-pressed="true" aria-label="Voting motto">01</button><button type="button" data-motto="1" aria-pressed="false" aria-label="Promises motto">02</button><button type="button" data-motto="2" aria-pressed="false" aria-label="Evidence motto">03</button></div><span>DATACRITUS.GR</span></footer>
<script>
(()=>{const r=document.getElementById('dc-poster');let lang='en',motto=0,paused=false,timer=null;const legacy=new URLSearchParams(location.hash.slice(1));if(legacy.has('indicator')||legacy.has('page'))location.replace('dashboard.html'+location.hash);const texts={en:{label:'QUESTION EVERYTHING.',metrics:'INDICATORS. YOUR VERDICT.',enter:'ENTER',challenge:'Don’t take anyone’s word.<br>Check the data.',footer:'LESS SPIN. <strong>MORE EVIDENCE.</strong>',mottos:['IF VOTING<br>CHANGED ANYTHING,<br>THEY’D MAKE IT<br><em>ILLEGAL.</em>','PROMISES<br>ARE EASY.<br><em>SHOW US<br>THE NUMBERS.</em>','VOTE WITH<br>YOUR VALUES.<br><em>THINK WITH<br>EVIDENCE.</em>']},el:{label:'ΑΜΦΙΣΒΗΤΗΣΤΕ ΤΑ ΠΑΝΤΑ.',metrics:'ΔΕΙΚΤΕΣ. ΔΙΚΗ ΣΑΣ ΚΡΙΣΗ.',enter:'ΕΙΣΟΔΟΣ',challenge:'Μην πιστεύετε στα λόγια.<br>Δείτε τα δεδομένα.',footer:'ΛΙΓΟΤΕΡΑ ΛΟΓΙΑ. <strong>ΠΕΡΙΣΣΟΤΕΡΑ ΣΤΟΙΧΕΙΑ.</strong>',mottos:['ΑΝ Η ΨΗΦΟΣ<br>ΑΛΛΑΖΕ ΚΑΤΙ,<br>ΘΑ ΗΤΑΝ<br><em>ΠΑΡΑΝΟΜΗ.</em>','ΟΙ ΥΠΟΣΧΕΣΕΙΣ<br>ΕΙΝΑΙ ΕΥΚΟΛΕΣ.<br><em>ΔΕΙΞΤΕ ΜΑΣ<br>ΤΑ ΝΟΥΜΕΡΑ.</em>','ΨΗΦΙΣΤΕ ΜΕ<br>ΤΙΣ ΑΞΙΕΣ ΣΑΣ.<br><em>ΣΚΕΦΤΕΙΤΕ ΜΕ<br>ΤΑ ΣΤΟΙΧΕΙΑ.</em>']}};function update(){for(const k of ['label','metrics','enter','challenge','footer'])r.querySelector('#dp-'+k).innerHTML=texts[lang][k];r.querySelector('#dp-motto').innerHTML=texts[lang].mottos[motto];r.querySelector('.dp-lang').textContent=lang==='en'?'ΕΛ':'EN';r.querySelector('.dp-circle').href='dashboard.html#lang='+lang;r.querySelectorAll('[data-motto]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.motto)===motto)));}r.querySelector('.dp-lang').addEventListener('click',()=>{lang=lang==='en'?'el':'en';update()});r.querySelectorAll('[data-motto]').forEach(b=>b.addEventListener('click',()=>{motto=Number(b.dataset.motto);update();startRotation()}));function startRotation(){if(timer!==null)clearInterval(timer);timer=null;if(!paused&&!document.hidden)timer=setInterval(()=>{motto=(motto+1)%3;update()},3500)}r.querySelector('.dp-pause').addEventListener('click',()=>{paused=!paused;r.querySelector('.dp-pause').textContent=paused?'▶':'Ⅱ';r.querySelector('.dp-pause').setAttribute('aria-pressed',String(paused));r.querySelector('.dp-pause').setAttribute('aria-label',paused?'Resume motto rotation':'Pause motto rotation');startRotation()});document.addEventListener('visibilitychange',startRotation);update();startRotation();})();
</script>
</div>
</body></html>
