name: Build multi-KPI feature pages
on:
  push:
    branches:
      - feature/multi-kpi-government-stories
    paths:
      - 'src/**'
      - '.github/workflows/build-multi-kpi-feature.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate site pages
        run: python scripts/build.py
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html index.html data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild multi-KPI website artifacts"
            git push
          fi
