name: Refresh official data
on:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_data.py'
      - 'scripts/catalog.py'
      - 'scripts/eurostat.py'
      - 'scripts/expansion.py'
      - 'scripts/ilo.py'
      - 'scripts/oecd.py'
      - 'scripts/ameco.py'
      - 'scripts/vetted.py'
      - 'scripts/vetted_labels.py'
      - 'scripts/taxonomy.py'
      - 'scripts/*_selection.json'
      - 'scripts/vetted_manifest.json'
      - 'scripts/requirements.txt'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: datacritus-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reviewed source readers
        run: pip install -r scripts/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve official observations
        run: python scripts/refresh_data.py
      - name: Verify data and calculations
        run: |
          python tests/check_data.py
          python tests/vetted.test.py
          python tests/oecd.test.py
          python tests/ilo.test.py
          python tests/ameco.test.py
          python tests/eurostat_expansion.test.py
          node tests/core.test.cjs
          node tests/government-comparison.test.cjs
      - name: Build standalone site
        run: |
          python scripts/build.py
          node tests/landing.test.cjs
      - name: Commit validated snapshot
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from datetime import datetime, timezone
          import json
          from pathlib import Path
          Path('data/refresh-meta.json').write_text(json.dumps({'lastSuccessfulRefresh': datetime.now(timezone.utc).date().isoformat()}, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
          git add el/index.html en/index.html data/refresh-meta.json data/indicators.json data/history.json index.html dashboard.html sitemap.xml en/indicators el/indicators en/about el/about en/methodology el/methodology assets/social data/seo
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh validated statistics and research observations'
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Request Pages deployment
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
