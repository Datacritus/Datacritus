name: Refresh official data
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/refresh-data.yml'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: datacritus-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve official observations
        run: python scripts/refresh_data.py
      - name: Verify data and calculations
        run: |
          python tests/check_data.py
          node tests/core.test.cjs
      - name: Build standalone site
        run: python scripts/build.py
      - name: Commit validated snapshot
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/indicators.json data/history.json index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh validated World Bank and Eurostat observations'
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Request Pages deployment
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
