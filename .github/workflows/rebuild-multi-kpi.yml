name: Rebuild multi-KPI feature branch
on:
  push:
    branches: [feature/multi-kpi-government-stories]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build.py
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html index.html data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate multi-KPI feature pages"
            git push
          fi
