name: Build multi-KPI branch pages
on:
  push:
    branches: [feature/multi-kpi-government-stories]
    paths:
      - 'src/app.js'
      - 'src/index.html'
      - 'src/style.css'
      - '.github/workflows/build-multi-kpi-branch.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild static pages
        run: python scripts/build.py
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dashboard.html data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "Build multi-KPI comparison pages"
            git push
          fi
