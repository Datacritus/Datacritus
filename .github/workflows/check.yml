name: Validate dashboard
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reviewed source readers
        run: pip install -r scripts/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check src/app.js
          node --check src/infographic.js
          node --check src/government-comparison.js
          node tests/core.test.cjs
          node tests/government-comparison.test.cjs
          node tests/infographic.test.cjs
          python tests/check_data.py
          python tests/vetted.test.py
          python tests/oecd.test.py
          python tests/ilo.test.py
          python tests/eurostat_expansion.test.py
          python scripts/build.py
          git diff --exit-code -- index.html data/history.json
